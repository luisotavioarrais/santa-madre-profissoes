plugins { id 'com.android.application' }
android {
    namespace 'br.com.santamadre.profissoes'
    compileSdk 35
    defaultConfig {
        // Identificador exclusivo para não conflitar com APKs de teste anteriores.
        applicationId 'br.com.santamadre.profissoes.teste'
        minSdk 29
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
