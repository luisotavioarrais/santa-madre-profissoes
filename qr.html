<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Codes — Santa Madre</title><style>body{font-family:Arial,sans-serif;margin:25px;background:#edf3fc;color:#15365c;text-align:center}h1{font-size:26px}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;max-width:750px;margin:auto}.card{background:white;border-radius:12px;padding:18px;break-inside:avoid}.card img{width:100%;max-width:240px}.card b{display:block;margin:10px}small{line-height:1.5}button{background:#224f92;color:white;border:0;border-radius:8px;padding:12px;margin:15px}@media print{button{display:none}body{background:white;margin:6px}.card{border:1px solid #ddd}}</style></head><body><h1>COLÉGIO SANTA MADRE</h1><h2>Qual é a sua futura profissão?</h2><small>Instale o APK no celular Android e escaneie o QR Code usando um leitor compatível com links de aplicativo. Se o leitor não reconhecer, abra o aplicativo e toque na profissão.</small><main id="qrs"></main><button onclick="print()">Imprimir QR Codes</button><script>for(const [slug,title,emoji] of [["escritor","Escritor","✍️"],["advogado","Advogado","⚖️"],["medico","Médico","🩺"],["empresario","Empresário","💼"]]){const link="santamadre://profissao?job="+slug;const d=document.createElement("div");d.className="card";d.innerHTML="<h2>"+emoji+" "+title+"</h2><img alt='QR Code "+title+"' src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data="+encodeURIComponent(link)+"'><b>"+link+"</b>";document.getElementById("qrs").appendChild(d)}</script></body></html>
